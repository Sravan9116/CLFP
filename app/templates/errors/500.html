{% extends "base.html" %}

{% block title %}Server Error (500) – CampusConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-octagon" style="font-size: 3.5rem; color: var(--highlight);"></i>
        <h2 class="fw-bold mt-3" style="color: var(--brand-secondary);">Internal Server Error (500)</h2>
        <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again shortly or contact the helpdesk.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-sage px-4">Return to Homepage</a>
    </div>
</div>
{% endblock %}
