{% extends "base.html" %}

{% block title %}Register Account – CampusConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card p-4 p-md-5 border" style="background-color: var(--card-bg); border-color: var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-2" style="width: 48px; height: 48px; background-color: var(--brand-primary-light); color: var(--brand-primary); border: 1px solid rgba(79, 124, 114, 0.2);">
                        <i class="bi bi-person-badge fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1" style="color: var(--brand-secondary);">Join CampusConnect</h3>
                    <p class="text-muted small">Register with your verified university credentials</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="full_name" class="form-label">Full Legal Name *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Alex Morgan Rivers" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">University Email *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. user@student.campusconnect.edu" required>
                            <div class="form-text small" style="color: var(--text-muted);">Must end in an approved institutional domain</div>
                        </div>

                        <div class="col-md-6">
                            <label for="institutional_id" class="form-label">Student / Faculty / Staff ID *</label>
                            <input type="text" class="form-control" id="institutional_id" name="institutional_id" placeholder="e.g. STU-2026-9041" required>
                        </div>

                        <div class="col-md-6">
                            <label for="user_type" class="form-label">Campus Affiliation *</label>
                            <select class="form-select" id="user_type" name="user_type" required>
                                <option value="student" selected>Student</option>
                                <option value="faculty">Faculty Member</option>
                                <option value="staff">Administrative Staff</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="department_id" class="form-label">Department *</label>
                            <select class="form-select" id="department_id" name="department_id" required>
                                <option value="">-- Select Academic Department --</option>
                                {% for d in departments %}
                                    <option value="{{ d.id }}">{{ d.department_name }} ({{ d.department_code }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6" id="year-of-study-group">
                            <label for="year_of_study" class="form-label">Year of Study (Students)</label>
                            <select class="form-select" id="year_of_study" name="year_of_study">
                                <option value="1">1st Year (Freshman)</option>
                                <option value="2">2nd Year (Sophomore)</option>
                                <option value="3">3rd Year (Junior)</option>
                                <option value="4">4th Year (Senior)</option>
                                <option value="5">Postgraduate / Graduate</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">Mobile Contact Number (Optional)</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 012-3456">
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" required>
                        </div>

                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <div class="form-check my-4">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label small text-muted" for="termsCheck">
                            I agree to the university <a href="{{ url_for('main.terms') }}" target="_blank">Terms & Conditions</a> and understand fraudulent claims carry disciplinary penalties.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-sage w-100 py-2 mb-3">
                        Complete Registration <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center pt-3 border-top" style="border-color: var(--border-color) !important;">
                    <span class="small text-muted">Already registered? </span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold" style="color: var(--brand-primary);">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
