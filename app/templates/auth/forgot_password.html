{% extends "base.html" %}

{% block title %}Password Recovery – CampusConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card p-4 p-md-5 border" style="background-color: var(--card-bg); border-color: var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-2" style="width: 48px; height: 48px; background-color: var(--accent-light); color: var(--accent); border: 1px solid rgba(217, 140, 104, 0.2);">
                        <i class="bi bi-key fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1" style="color: var(--brand-secondary);">Password Recovery</h3>
                    <p class="text-muted small">Enter your campus email to receive reset instructions</p>
                </div>

                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-4">
                        <label for="email" class="form-label">University Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@campusconnect.edu" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-sage w-100 py-2 mb-3">
                        Send Reset Link <i class="bi bi-send ms-1"></i>
                    </button>
                </form>

                <div class="text-center pt-3 border-top" style="border-color: var(--border-color) !important;">
                    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none fw-semibold" style="color: var(--brand-primary);"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
