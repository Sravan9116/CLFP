{% extends "base.html" %}

{% block title %}Set New Password – CampusConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card p-4 p-md-5 border" style="background-color: var(--card-bg); border-color: var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1" style="color: var(--brand-secondary);">Create New Password</h3>
                    <p class="text-muted small">Choose a secure password of at least 8 characters</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
                    </div>

                    <button type="submit" class="btn btn-sage w-100 py-2 mb-3">
                        Save Password & Log In <i class="bi bi-check2-circle ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
